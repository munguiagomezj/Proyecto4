name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e contra la API real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar la API (Proyecto 2)
        uses: actions/checkout@v4
        with:
          repository: munguiagomezj/Proyecto2
          path: api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Arrancar la API
        working-directory: api
        env:
          DATABASE_URL: sqlite:///./e2e.db
          SECRET_KEY: clave-solo-para-los-tests-end-to-end-de-ci
          CORS_ORIGINS: '["http://localhost:4174"]'
        run: |
          pip install -e .
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat ../api.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            api.log
